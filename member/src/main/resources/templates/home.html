<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>회원관리 시스템</title>
</head>
<body>
<h1>회원관리 시스템</h1>

<div th:if="${!isLoggedIn}">
    <a href="/signup">회원가입</a>
    <a href="/login">로그인</a>
</div>

<div th:if="${isLoggedIn}">
    <p>로그인 상태입니다.</p>
    <button onclick="logout()">로그아웃</button>
</div>

<script>
    function logout() {
        fetch('/api/members/logout', { method: 'POST' })
            .then(() => location.reload());
    }
</script>
</body>
</html>
